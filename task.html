<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        
        .container {
            width: 800px;
            height: 400px;
            border-radius: 40px;
            margin: 100px 250px;
            display: flex;
            overflow: hidden;
            box-shadow: 4px 4px 10px black;
        }
        
        .card {
            width: 100%;
            height: 100%;
            border-radius: 40px;
            flex-shrink: 0;
            overflow: hidden;
            transition: 600ms;
        }
        
        #prevBtn {
            padding: 20px;
            border-radius: 50%;
            position: absolute;
            top: 150px;
            left: 180px;
            cursor: pointer;
            box-shadow: 4px 4px 10px black;
            border: none;
            background: linear-gradient(white);
        }
        
        #nextBtn {
            padding: 20px;
            border-radius: 50%;
            position: absolute;
            left: 1070px;
            bottom: 200px;
            cursor: pointer;
            box-shadow: 4px 4px 10px black;
            border: none;
            background: linear-gradient(white);
        }
        
        body {
            position: relative;
            background: linear-gradient( grey);
        }
        
        .maindot {
            display: flex;
            gap: 10px;
            position: absolute;
            top: 430px;
            left: 600px;
        }
        
        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            box-shadow: 4px 4px 10px black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card"><img src="img1.webp" alt="" width="100%" height="100%"></div>
        <div class="card"><img src="img2.webp" alt="" width="100%" height="100%"></div>
        <div class="card"><img src="img3.webp" alt="" width="100%" height="100%"></div>
        <div class="card"><img src="img4.webp" alt="" width="100%" height="100%"></div>
        <div class="card"><img src="img5.webp" alt="" width="100%" height="100%"></div>
        <div class="card"><img src="img3.webp" alt="" width="100%" height="100%"></div>
    </div>
    <div class="maindot">
        <div class="dot" style="background-color: black;"></div>
        <div class="dot" style="background-color: white;"></div>
        <div class="dot" style="background-color: white;"></div>
        <div class="dot" style="background-color: white;"></div>
        <div class="dot" style="background-color: white;"></div>
        <div class="dot" style="background-color: white;"></div>
    </div>

    <button id="prevBtn"><i class="fa-solid fa-circle-chevron-left"></i></button>
    <button id="nextBtn"><i class="fa-solid fa-circle-chevron-right"></i></button>

</body>
<script>
    const cards = document.querySelector(".card");
    const prevBtn = document.querySelector("#prevBtn");
    const nextBtn = document.querySelector("#nextBtn");

    let count = 0;
    nextBtn.addEventListener("click", function() {
        count++
        if (count > cards.length - 1) {
            count == 0;
        }
        cards.forEach(function(card, index) {
            card.style.transform = `translateX(-${count*100}%)`
        })
    })

    prevBtn.addEventListener("click", function(data) {
        if (count == 0) return
        count--;
        cards.forEach(function(card, index) {
            card.style.transform = `translateX(-${count*100}%)`
        })
    })
</script>

</html>
